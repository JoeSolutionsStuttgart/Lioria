<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Postfach</title>
<link rel="stylesheet" href="broadsheet.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
<style>
  body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }
  a { color: var(--color-accent-700); } a:hover { color: var(--color-accent-800); }
  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
</style>
<script src="chronik-config.js"></script>
</head>
<body>
<div id="app" style="max-width: 980px; margin: 0 auto; padding: 28px 18px 80px; box-sizing: border-box;"></div>
<script>
(function () {
  var CFG = window.CHRONIK_CONFIG || {};
  var NAME = String(CFG.appName || "Chronik");
  var KEYS = "fb_postfach_schluessel";
  var REAK = ["👍", "❤️", "💡", "🛠️", "👀", "✅"];
  var STATUS = [["neu", "Neu"], ["gelesen", "Gelesen"], ["geplant", "Geplant"], ["erledigt", "Erledigt"], ["abgelehnt", "Nicht geplant"]];
  var ARTEN = { idee: "Idee", fehler: "Fehler", frage: "Frage", lob: "Lob", sonst: "Sonstiges" };
  var FEHL = { "F-01": "Noch kein Schlüssel gesetzt. Im SQL-Editor feedback_schluessel_setzen ausführen.", "F-02": "Schlüssel falsch.", "F-03": "Zu viele Fehlversuche – vorübergehend gesperrt.", "F-06": "Feedback ist noch nicht eingerichtet (supabase-update-32.sql)." };
  var sb = null, schluessel = "", liste = [], offen = {}, entwurf = {}, f = { status: "offen", art: "", suche: "", sort: "neu" }, fehler = "", busy = false;
  try { schluessel = sessionStorage.getItem(KEYS) || ""; } catch (e) {}
  var app = document.getElementById("app");
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function zeit(z) { try { return new Date(z).toLocaleString("de-DE", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } }
  var KICK = "font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--color-accent-700);";

  function sdk() {
    return new Promise(function (ok, no) {
      if (window.supabase) return ok();
      var s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js";
      s.onload = ok; s.onerror = function () { no(new Error("SDK")); };
      document.head.appendChild(s);
    });
  }
  async function client() {
    if (sb) return sb;
    await sdk();
    var url = String(CFG.url || "").trim().replace(/\/+$/, "").replace(/\/(rest|auth|storage|realtime)\/v1.*$/i, "");
    if (!/^https?:\/\//.test(url)) url = "https://" + url;
    sb = window.supabase.createClient(url, String(CFG.anonKey || "").trim(), { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
    return sb;
  }
  async function rpc(name, args) {
    var c = await client();
    var r = await c.rpc(name, args);
    if (r.error) { var m = String(r.error.message || "") + " " + (r.error.code || ""); throw new Error(/PGRST202|42883/.test(m) ? "F-06" : m); }
    if (r.data && r.data.ok === false) throw new Error(r.data.fehler || "F-02");
    return r.data;
  }
  async function laden() {
    busy = true; fehler = ""; malen();
    try {
      var d = await rpc("feedback_admin_liste", { p_key: schluessel });
      liste = d.liste || [];
      try { sessionStorage.setItem(KEYS, schluessel); } catch (e) {}
    } catch (e) {
      fehler = FEHL[e.message] || ("Laden fehlgeschlagen: " + e.message);
      if (/F-0[123]/.test(e.message)) { schluessel = ""; try { sessionStorage.removeItem(KEYS); } catch (x) {} }
    }
    busy = false; malen();
  }
  async function aendern(id, was) {
    try {
      await rpc("feedback_admin_aendern", { p_key: schluessel, p_id: id, p_status: was.status || null, p_reaktion: was.reaktion == null ? null : was.reaktion, p_antwort: was.antwort || null, p_loeschen: !!was.loeschen });
      await laden();
    } catch (e) { fehler = FEHL[e.message] || e.message; malen(); }
  }

  function gefiltert() {
    var q = f.suche.trim().toLowerCase();
    var l = liste.filter(function (m) {
      if (f.status === "offen" && (m.status === "erledigt" || m.status === "abgelehnt")) return false;
      if (f.status && f.status !== "offen" && f.status !== "alle" && m.status !== f.status) return false;
      if (f.art && m.kind !== f.art) return false;
      if (q && (m.text + " " + m.name + " " + m.email + " " + (m.antworten || []).map(function (a) { return a.text; }).join(" ")).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    l.sort(function (a, b) {
      if (f.sort === "alt") return new Date(a.created) - new Date(b.created);
      if (f.sort === "aktiv") return (b.team_neu - a.team_neu) || (new Date(b.geaendert) - new Date(a.geaendert));
      return new Date(b.created) - new Date(a.created);
    });
    return l;
  }
  function sel(name, wert, opts) {
    return '<select data-f="' + name + '" class="input" style="font-size:15px;min-height:44px;width:auto;">' + opts.map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === wert ? " selected" : "") + ">" + esc(o[1]) + "</option>"; }).join("") + "</select>";
  }

  function malen() {
    if (!schluessel) {
      app.innerHTML = '<div style="max-width:420px;display:grid;gap:14px;padding-top:12vh;">' +
        '<div style="' + KICK + '">' + esc(NAME) + " · intern</div>" +
        '<h1 style="margin:0;font-family:var(--font-heading);font-size:40px;line-height:1.05;">Postfach</h1>' +
        '<form data-a="login" style="display:grid;gap:10px;"><input name="k" type="password" class="input" autocomplete="current-password" placeholder="Geheimer Schlüssel" style="font-size:16px;min-height:48px;" autofocus>' +
        '<button class="btn btn-primary" style="min-height:48px;justify-self:start;"' + (busy ? " disabled" : "") + ">Öffnen</button></form>" +
        (fehler ? '<div role="alert" style="color:var(--color-accent-2-700);font-size:14.5px;">' + esc(fehler) + "</div>" : "") +
        '<div style="font-size:13px;line-height:1.5;color:var(--color-neutral-700);">Der Schlüssel bleibt nur in diesem Tab, bis er geschlossen wird.</div></div>';
      return;
    }
    var l = gefiltert();
    var z = function (fn) { return liste.filter(fn).length; };
    var html = '<header style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:14px;">' +
      '<div><div style="' + KICK + '">' + esc(NAME) + ' · intern</div><h1 style="margin:2px 0 0;font-family:var(--font-heading);font-size:40px;line-height:1.05;">Postfach</h1>' +
      '<div style="font-size:14px;color:var(--color-neutral-700);margin-top:4px;">' + z(function (m) { return m.status === "neu"; }) + " neu · " + z(function (m) { return m.team_neu && m.status !== "neu"; }) + " mit Nachtrag · " + liste.length + " gesamt</div></div>" +
      '<div style="display:flex;gap:8px;"><button data-a="neu" class="btn btn-secondary" style="min-height:44px;"><i class="ph-duotone ph-arrows-clockwise"></i> Aktualisieren</button><button data-a="aus" class="btn btn-ghost" style="min-height:44px;">Abmelden</button></div></header>' +
      '<div style="height:3px;background:var(--color-text);margin-bottom:2px;"></div><div style="height:1px;background:var(--color-text);margin-bottom:18px;"></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px;">' +
      sel("status", f.status, [["offen", "Offen"], ["alle", "Alle"]].concat(STATUS)) +
      sel("art", f.art, [["", "Alle Arten"]].concat(Object.keys(ARTEN).map(function (k) { return [k, ARTEN[k]]; }))) +
      sel("sort", f.sort, [["neu", "Neueste zuerst"], ["alt", "Älteste zuerst"], ["aktiv", "Zuletzt aktiv"]]) +
      '<input data-f="suche" class="input" placeholder="Suchen …" value="' + esc(f.suche) + '" style="flex:1;min-width:160px;font-size:16px;min-height:44px;"></div>' +
      (fehler ? '<div role="alert" style="color:var(--color-accent-2-700);font-size:14.5px;margin-bottom:12px;">' + esc(fehler) + "</div>" : "") +
      (!l.length ? '<div style="font-size:15px;color:var(--color-neutral-700);padding:24px 0;">Nichts in dieser Auswahl.</div>' : "");
    l.forEach(function (m) {
      var auf = !!offen[m.id];
      var wer = m.name ? esc(m.name) : (m.user_id ? "Konto" : "Ohne Konto");
      var mail = m.email ? ' · <a href="mailto:' + esc(m.email) + "?subject=" + encodeURIComponent("Dein Feedback an " + NAME) + '">' + esc(m.email) + "</a>" : "";
      html += '<article style="display:grid;gap:8px;padding:16px 0;border-top:1px solid var(--color-neutral-200);">' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--color-neutral-700);">' +
        '<span class="tag ' + (m.kind === "fehler" ? "tag-accent-2" : "tag-neutral") + '">' + esc(ARTEN[m.kind] || m.kind) + "</span>" +
        (m.status === "neu" ? '<span class="tag tag-accent">Neu</span>' : "") + (m.team_neu && m.status !== "neu" ? '<span class="tag tag-accent">Nachtrag</span>' : "") +
        "<span>" + esc(zeit(m.created)) + " · " + wer + mail + "</span>" + (m.reaktion ? '<span style="font-size:18px;">' + esc(m.reaktion) + "</span>" : "") + "</div>" +
        '<button data-a="auf" data-id="' + m.id + '" style="all:unset;cursor:pointer;font-size:16.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;' + (auf ? "" : "display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;") + '">' + esc(m.text) + "</button>";
      if (auf) {
        if (m.seite || m.geraet) html += '<div style="font-size:12.5px;line-height:1.5;color:var(--color-neutral-700);overflow-wrap:anywhere;">' + esc(m.seite) + (m.geraet ? "<br>" + esc(m.geraet) : "") + "</div>";
        (m.antworten || []).forEach(function (a) {
          var team = a.von === "team";
          html += '<div style="display:grid;gap:2px;padding:8px 12px;border-radius:var(--radius-md);background:' + (team ? "var(--color-accent-100)" : "var(--color-neutral-100)") + ';' + (team ? "margin-left:24px;" : "margin-right:24px;") + '"><div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-700);">' + (team ? "Team" : "Nutzer") + " · " + esc(zeit(a.zeit)) + '</div><div style="font-size:14.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;">' + esc(a.text) + "</div></div>";
        });
        html += '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">' +
          REAK.map(function (r) { var an = m.reaktion === r; return '<button data-a="reak" data-id="' + m.id + '" data-v="' + r + '" aria-pressed="' + an + '" title="Reagieren" style="width:44px;height:44px;border-radius:50%;font-size:19px;cursor:pointer;background:' + (an ? "var(--color-accent-200)" : "transparent") + ';border:1px solid ' + (an ? "var(--color-accent)" : "var(--color-neutral-300)") + ';">' + r + "</button>"; }).join("") +
          '<select data-a="status" data-id="' + m.id + '" class="input" style="width:auto;min-height:44px;font-size:15px;margin-left:auto;">' + STATUS.map(function (s) { return '<option value="' + s[0] + '"' + (s[0] === m.status ? " selected" : "") + ">" + s[1] + "</option>"; }).join("") + "</select></div>" +
          '<textarea data-a="entwurf" data-id="' + m.id + '" class="input" rows="3" placeholder="' + (m.user_id ? "Antwort – erscheint beim Nutzer im Feedback-Fenster" : "Antwort – ohne Konto nur per Mail erreichbar") + '" style="font-size:16px;resize:vertical;">' + esc(entwurf[m.id] || "") + "</textarea>" +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;"><button data-a="antw" data-id="' + m.id + '" class="btn btn-primary" style="min-height:44px;">Antworten</button>' +
          '<button data-a="antw-erl" data-id="' + m.id + '" class="btn btn-secondary" style="min-height:44px;">Antworten &amp; erledigt</button>' +
          '<button data-a="weg" data-id="' + m.id + '" class="btn btn-ghost" style="min-height:44px;margin-left:auto;color:var(--color-accent-2-700);"><i class="ph-duotone ph-trash"></i> Löschen</button></div>';
      }
      html += "</article>";
    });
    var fokus = document.activeElement && document.activeElement.getAttribute && document.activeElement.getAttribute("data-f") === "suche";
    app.innerHTML = html;
    if (fokus) { var s = app.querySelector('[data-f="suche"]'); s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
  }

  app.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var k = ev.target.querySelector("[name=k]").value;
    if (k.length < 8) { fehler = "Schlüssel zu kurz."; return malen(); }
    schluessel = k; laden();
  });
  app.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-a]"); if (!el) return;
    var a = el.getAttribute("data-a"), id = el.getAttribute("data-id");
    var m = liste.filter(function (x) { return x.id === id; })[0];
    if (a === "neu") return laden();
    if (a === "aus") { schluessel = ""; liste = []; try { sessionStorage.removeItem(KEYS); } catch (e) {} return malen(); }
    if (a === "auf") { offen[id] = !offen[id]; malen(); if (offen[id] && m && (m.status === "neu" || m.team_neu)) aendern(id, { status: m.status === "neu" ? "gelesen" : m.status }); return; }
    if (a === "reak") return aendern(id, { reaktion: m && m.reaktion === el.getAttribute("data-v") ? "" : el.getAttribute("data-v") });
    if (a === "antw" || a === "antw-erl") { var t = String(entwurf[id] || "").trim(); if (!t && a === "antw") return; entwurf[id] = ""; return aendern(id, { antwort: t, status: a === "antw-erl" ? "erledigt" : (m.status === "neu" ? "gelesen" : m.status) }); }
    if (a === "weg") { if (confirm("Diese Meldung endgültig löschen?")) aendern(id, { loeschen: true }); }
  });
  app.addEventListener("input", function (ev) {
    var t = ev.target;
    if (t.getAttribute("data-a") === "entwurf") entwurf[t.getAttribute("data-id")] = t.value;
    if (t.getAttribute("data-f") === "suche") { f.suche = t.value; malen(); }
  });
  app.addEventListener("change", function (ev) {
    var t = ev.target, k = t.getAttribute("data-f");
    if (k && k !== "suche") { f[k] = t.value; return malen(); }
    if (t.getAttribute("data-a") === "status") aendern(t.getAttribute("data-id"), { status: t.value });
  });
  if (schluessel) laden(); else malen();
})();
</script>
</body>
</html>
